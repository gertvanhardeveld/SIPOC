<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPOC Builder</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
  :root{
    color-scheme: light;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --grey-box: #e7e8ea;
    --grey-box-border: #d3d5d9;
    --grey-text: #8a8d93;
    --dark-text: #24262b;
    --header-text: #2f6fb0;
    --process-border: #24262b;
    --line: #9a9da3;
    --guide: #d7d9dd;
    --accent: #2f6fb0;
    --accent-bg: #eaf2fb;
    --danger: #c0392b;
    --danger-bg: #fbeceb;
    --border: #e2e4e8;
    --grid-cols:
      minmax(120px,1fr) 30px
      minmax(120px,1fr) 30px
      minmax(150px,1.15fr) 30px
      minmax(120px,1fr) 30px
      minmax(120px,1fr);
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin:0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--dark-text);
  }

  /* ---------- App shell: sidebar + main ---------- */
  #app{
    display:flex;
    min-height:100vh;
    align-items:stretch;
  }
  #sidebar{
    flex: 0 0 260px;
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 14px;
    display:flex;
    flex-direction:column;
    gap: 12px;
    position: sticky;
    top: 0;
    align-self: flex-start;
    max-height: 100vh;
    overflow-y: auto;
  }
  #sidebar h1{
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 2px;
    letter-spacing: .2px;
  }
  #sidebar .sidebar-sub{
    font-size: 11.5px;
    color: var(--grey-text);
    margin: 0 0 4px;
  }
  #search{
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--grey-box-border);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    background: var(--bg);
  }
  #search:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
    background: #fff;
  }
  #new-process-btn{
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1.5px dashed #b7bac0;
    background: #fff;
    color: var(--dark-text);
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #new-process-btn:hover{
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-bg);
  }
  #process-tree{
    flex: 1;
    overflow-y: auto;
    margin-top: 4px;
  }
  .tree-empty{
    font-size: 12.5px;
    color: var(--grey-text);
    margin: 8px 2px;
  }
  .tree-group{ margin-bottom: 6px; }
  .tree-letter{
    font-size: 11px;
    font-weight: 700;
    color: var(--grey-text);
    padding: 6px 6px 2px;
    letter-spacing: .4px;
  }
  .tree-item{
    display:flex;
    align-items:center;
    gap: 4px;
    border-radius: 6px;
  }
  .tree-item.active{ background: var(--accent-bg); }
  .tree-name{
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--dark-text);
    padding: 6px 6px;
    cursor: pointer;
    border-radius: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tree-item.active .tree-name{ color: var(--accent); font-weight: 600; }
  .tree-name:hover{ background: var(--accent-bg); }
  .tree-placeholder{ color: var(--grey-text); font-style: italic; }
  .tree-delete{
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--grey-text);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity: 0;
  }
  .tree-item:hover .tree-delete{ opacity: 1; }
  .tree-delete:hover{ background: var(--danger-bg); color: var(--danger); }

  /* ---------- Main content ---------- */
  #main{
    flex: 1;
    min-width: 0;
    padding: 28px 24px 80px;
    overflow-x: auto;
  }
  #process-header{
    max-width: 1180px;
    margin: 0 auto 22px;
  }
  .process-name-row{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .box-process-name{
    flex: 1;
    background: #ffffff;
    border: 1.5px solid var(--process-border);
    border-radius: 10px;
    font-size: 17px;
    font-weight: 700;
    padding: 12px 16px;
    text-align: left;
  }
  .sync-status{
    flex: 0 0 auto;
    font-size: 11.5px;
    color: var(--grey-text);
    white-space: nowrap;
  }
  .sync-status.saving{ color: var(--accent); }
  .sync-status.error{ color: var(--danger); font-weight: 600; }

  .subtitle{
    text-align:center;
    font-size: 12.5px;
    color: var(--grey-text);
    margin: 0 0 24px;
  }
  #board-wrap{
    max-width: 1180px;
    margin: 0 auto;
    overflow-x: auto;
  }
  #board{
    min-width: 760px;
    position: relative;
  }
  .grid-guides{
    position: absolute;
    inset: 0;
    display:grid;
    grid-template-columns: var(--grid-cols);
    grid-template-rows: 1fr;
    pointer-events: none;
    z-index: 0;
  }
  .grid-guides .guide{
    justify-self: center;
    width: 0;
    border-left: 1px dashed var(--guide);
  }
  .headers, .step-grid{
    display:grid;
    grid-template-columns: var(--grid-cols);
    column-gap: 0;
    align-items: stretch;
  }
  .headers{
    position: relative;
    z-index: 1;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px dashed #c7c9ce;
  }
  .headers .col-label{
    font-size: 12.5px;
    font-weight: 700;
    color: var(--header-text);
    text-align: center;
    letter-spacing: .2px;
  }
  .step-grid{
    row-gap: 12px;
    padding: 14px 0;
    position: relative;
  }
  .cell{
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 46px;
  }
  .arrow-cell{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 46px;
  }
  .arrow-h{
    position: relative;
    width: calc(100% - 10px);
    height: 2px;
    background: var(--line);
  }
  .arrow-h::after{
    content:"";
    position:absolute;
    right:-1px;
    top:50%;
    transform:translateY(-50%);
    width:0; height:0;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-left: 6px solid var(--line);
  }
  .arrow-v-wrap{
    display:flex;
    justify-content:center;
    align-items:stretch;
    height:100%;
    min-height: 26px;
  }
  .arrow-v{
    position: relative;
    width: 2px;
    background: var(--line);
    margin: 0 auto;
  }
  .arrow-v::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-1px;
    transform:translateX(-50%);
    width:0; height:0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 6px solid var(--line);
  }
  .box{
    width:100%;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.3;
    text-align:center;
    background: var(--grey-box);
    border: 1px solid var(--grey-box-border);
    cursor: text;
    word-break: break-word;
    outline: none;
    transition: box-shadow .12s ease, border-color .12s ease;
  }
  .box.placeholder{
    color: var(--grey-text);
  }
  .box:not(.placeholder){
    color: var(--dark-text);
  }
  .box:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
    background: #fff;
  }
  .box-process{
    background: #ffffff;
    border: 1.5px solid var(--process-border);
    border-radius: 10px;
    font-weight: 600;
    padding: 14px 16px;
    min-height: 54px;
  }
  .process-wrap{
    position: relative;
    width: 100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .minus{
    position:absolute;
    top:-8px;
    right:-8px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #e6b3ae;
    font-size: 12px;
    line-height: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .minus:hover{ background:#f6d5d2; }
  .minus-step{
    position:absolute;
    top:-9px;
    right:-9px;
    width: 20px;
    height: 20px;
    font-size: 13px;
  }
  .plus-step{
    position:absolute;
    bottom:-10px;
    left: calc(50% + 4px);
    width: 20px;
    height: 20px;
    font-size: 13px;
    z-index: 2;
  }
  .edge-plus{
    position:absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    font-size: 13px;
    z-index: 2;
  }
  .edge-plus-left{ left:-10px; }
  .edge-plus-right{ right:-10px; }
  .addbtn{
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    border: 1.5px dashed #b7bac0;
    color: #7c7f85;
    font-size: 14px;
    line-height: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    padding:0;
  }
  .addbtn:hover{
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-bg);
  }
  .step-block{
    position: relative;
    z-index: 1;
  }
  footer{
    max-width: 1180px;
    margin: 28px auto 0;
    text-align:center;
    font-size: 11.5px;
    color: var(--grey-text);
  }

  @media (max-width: 760px){
    #app{ flex-direction: column; }
    #sidebar{
      position: static;
      width: 100%;
      flex: 0 0 auto;
      max-height: 260px;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    #main{ padding: 20px 16px 60px; }
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <h1>SIPOC</h1>
    <p class="sidebar-sub">Alle processen</p>
    <input id="search" type="search" placeholder="Zoek proces…" autocomplete="off">
    <button id="new-process-btn" type="button">+ Nieuw proces</button>
    <div id="process-tree"><p class="tree-empty">Laden…</p></div>
  </aside>

  <main id="main">
    <div id="process-header"></div>
    <div id="board-wrap">
      <div id="board"></div>
    </div>
    <footer>Suppliers &middot; Input &middot; Processtap &middot; Output &middot; Customer</footer>
  </main>
</div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------------
  // Supabase
  // ---------------------------------------------------------------------
  var SUPABASE_URL = "https://ijfsmtzopsuenpytomee.supabase.co";
  var SUPABASE_KEY = "sb_publishable_cN_JXrTeW3lEV5ObhICFpw_GQX9deID";

  if (!window.supabase || !window.supabase.createClient){
    document.getElementById("app").innerHTML =
      '<div style="padding:60px 24px;text-align:center;max-width:420px;margin:0 auto;">' +
        '<p style="font-weight:700;color:#c0392b;margin-bottom:8px;">Kon de database-bibliotheek niet laden</p>' +
        '<p style="font-size:13px;color:#8a8d93;">Controleer je internetverbinding en herlaad de pagina.</p>' +
      '</div>';
    return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var COLS = {
    supplier: "Supplier",
    input: "Input",
    process: "Processtap",
    output: "Output",
    customer: "Customer"
  };

  function makeId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function makeStep(){ return { id: makeId(), label: null, inputs: [], outputs: [] }; }
  function makeInput(){ return { id: makeId(), label: null, supplier: null }; }
  function makeOutput(){ return { id: makeId(), label: null, customer: null }; }
  function makeSupplier(){ return { id: makeId(), label: null }; }
  function makeCustomer(){ return { id: makeId(), label: null }; }

  // Current SIPOC being edited
  var state = { processId: null, processName: null, steps: [ makeStep() ] };
  // All processes, for the sidebar tree: [{id, name}]
  var processList = [];
  var searchText = "";

  // ---------------------------------------------------------------------
  // Small helpers
  // ---------------------------------------------------------------------
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  function box(opts){
    // opts: {label, placeholder, path, extraClass}
    var isEmpty = !opts.label;
    var text = isEmpty ? opts.placeholder : escapeHtml(opts.label);
    return '<div class="box ' + (opts.extraClass || '') + (isEmpty ? ' placeholder' : '') + '" ' +
      'data-path="' + opts.path + '" data-placeholder="' + escapeHtml(opts.placeholder) + '">' +
      text + '</div>';
  }

  function minusBtn(action, attrs, extraClass){
    var attrStr = "";
    for (var k in attrs){ attrStr += ' data-' + k + '="' + attrs[k] + '"'; }
    return '<button class="minus ' + (extraClass||'') + '" data-action="' + action + '"' + attrStr + ' title="Verwijderen">&times;</button>';
  }

  function edgeAddBtn(action, attrs, title, side){
    var attrStr = "";
    for (var k in attrs){ attrStr += ' data-' + k + '="' + attrs[k] + '"'; }
    return '<button class="addbtn edge-plus edge-plus-' + side + '" data-action="' + action + '"' + attrStr + ' title="' + title + '">+</button>';
  }

  function arrowRight(){
    return '<div class="arrow-cell"><div class="arrow-h"></div></div>';
  }

  // ---------------------------------------------------------------------
  // Board rendering (grid, guides, headers, step blocks)
  // ---------------------------------------------------------------------
  function renderGuides(){
    return (
      '<div class="grid-guides">' +
        '<div class="guide" style="grid-column:2;"></div>' +
        '<div class="guide" style="grid-column:4;"></div>' +
        '<div class="guide" style="grid-column:6;"></div>' +
        '<div class="guide" style="grid-column:8;"></div>' +
      '</div>'
    );
  }

  function renderHeaders(){
    return (
      '<div class="headers">' +
        '<div class="col-label">Suppliers</div><div></div>' +
        '<div class="col-label">Input</div><div></div>' +
        '<div class="col-label">Processtap</div><div></div>' +
        '<div class="col-label">Output</div><div></div>' +
        '<div class="col-label">Customer</div>' +
      '</div>'
    );
  }

  function renderStepBlock(step, sIdx){
    var rowCount = Math.max(step.inputs.length, step.outputs.length, 1);
    var rowsHtml = "";

    for (var r = 0; r < rowCount; r++){
      var inp = step.inputs[r];
      var out = step.outputs[r];

      // --- Supplier cell ---
      var supplierCellInner, arrowSupplierInput;
      if (inp && inp.supplier){
        supplierCellInner =
          '<div class="process-wrap">' +
            box({ label: inp.supplier.label, placeholder: COLS.supplier, path: sIdx + ".input." + r + ".supplier.label", extraClass: "box-supplier" }) +
            minusBtn("removeSupplier", { step: sIdx, input: r }) +
          '</div>';
        arrowSupplierInput = arrowRight();
      } else {
        supplierCellInner = "";
        arrowSupplierInput = '<div class="arrow-cell"></div>';
      }

      // --- Input cell ---
      var inputCellInner, arrowInputProcess;
      if (inp){
        inputCellInner =
          '<div class="process-wrap">' +
            box({ label: inp.label, placeholder: COLS.input, path: sIdx + ".input." + r + ".label", extraClass: "box-input" }) +
            minusBtn("removeInput", { step: sIdx, input: r }) +
            (inp.supplier ? '' : edgeAddBtn("addSupplier", { step: sIdx, input: r }, "Supplier toevoegen", "left")) +
          '</div>';
        arrowInputProcess = arrowRight();
      } else {
        inputCellInner = "";
        arrowInputProcess = '<div class="arrow-cell"></div>';
      }

      // --- Process cell (only rendered on first row, spans full block) ---
      var processCellInner = "";
      if (r === 0){
        processCellInner =
          '<div class="process-wrap">' +
            box({ label: step.label, placeholder: COLS.process, path: sIdx + ".label", extraClass: "box-process" }) +
            minusBtn("removeStep", { step: sIdx }, "minus-step") +
            '<button class="addbtn plus-step" data-action="addStep" data-step="' + sIdx + '" title="Processtap invoegen na deze stap">+</button>' +
            edgeAddBtn("addInput", { step: sIdx }, "Input toevoegen", "left") +
            edgeAddBtn("addOutput", { step: sIdx }, "Output toevoegen", "right") +
          '</div>';
      }

      // --- Output cell ---
      var arrowProcessOutput, outputCellInner;
      if (out){
        arrowProcessOutput = arrowRight();
        outputCellInner =
          '<div class="process-wrap">' +
            box({ label: out.label, placeholder: COLS.output, path: sIdx + ".output." + r + ".label", extraClass: "box-output" }) +
            minusBtn("removeOutput", { step: sIdx, output: r }) +
            (out.customer ? '' : edgeAddBtn("addCustomer", { step: sIdx, output: r }, "Customer toevoegen", "right")) +
          '</div>';
      } else {
        arrowProcessOutput = '<div class="arrow-cell"></div>';
        outputCellInner = "";
      }

      // --- Customer cell ---
      var arrowOutputCustomer, customerCellInner;
      if (out && out.customer){
        arrowOutputCustomer = arrowRight();
        customerCellInner =
          '<div class="process-wrap">' +
            box({ label: out.customer.label, placeholder: COLS.customer, path: sIdx + ".output." + r + ".customer.label", extraClass: "box-customer" }) +
            minusBtn("removeCustomer", { step: sIdx, output: r }) +
          '</div>';
      } else {
        arrowOutputCustomer = '<div class="arrow-cell"></div>';
        customerCellInner = "";
      }

      rowsHtml +=
        '<div class="cell" style="grid-row:' + (r+1) + '; grid-column:1;">' + supplierCellInner + '</div>' +
        '<div style="grid-row:' + (r+1) + '; grid-column:2;">' + arrowSupplierInput + '</div>' +
        '<div class="cell" style="grid-row:' + (r+1) + '; grid-column:3;">' + inputCellInner + '</div>' +
        '<div style="grid-row:' + (r+1) + '; grid-column:4;">' + arrowInputProcess + '</div>' +
        (processCellInner ? ('<div class="cell" style="grid-row: 1 / span ' + rowCount + '; grid-column:5;">' + processCellInner + '</div>') : '') +
        '<div style="grid-row:' + (r+1) + '; grid-column:6;">' + arrowProcessOutput + '</div>' +
        '<div class="cell" style="grid-row:' + (r+1) + '; grid-column:7;">' + outputCellInner + '</div>' +
        '<div style="grid-row:' + (r+1) + '; grid-column:8;">' + arrowOutputCustomer + '</div>' +
        '<div class="cell" style="grid-row:' + (r+1) + '; grid-column:9;">' + customerCellInner + '</div>';
    }

    var blockHtml = '<div class="step-grid">' + rowsHtml + '</div>';

    // control row: just the connector line down to the next step (add-input/add-output live on the process box itself)
    var isLast = sIdx === state.steps.length - 1;
    var controlHtml = isLast ? '' :
      '<div class="step-grid" style="row-gap:0;">' +
        '<div class="cell" style="grid-row:1; grid-column:5;"><div class="arrow-v-wrap"><div class="arrow-v"></div></div></div>' +
      '</div>';

    return '<div class="step-block" data-step-block="' + sIdx + '">' + blockHtml + controlHtml + '</div>';
  }

  function render(){
    var html = renderGuides() + renderHeaders();
    state.steps.forEach(function(step, idx){
      html += renderStepBlock(step, idx);
    });
    document.getElementById("board").innerHTML = html;
  }

  function renderProcessHeader(){
    var wrap = document.getElementById("process-header");
    wrap.innerHTML =
      '<div class="process-name-row">' +
        box({ label: state.processName, placeholder: "Procesnaam", path: "process.name", extraClass: "box-process-name" }) +
        '<span id="sync-status" class="sync-status idle">Opgeslagen</span>' +
      '</div>';
  }

  function renderAll(){
    renderProcessHeader();
    render();
    renderSidebar();
  }

  // ---------------------------------------------------------------------
  // Sidebar: search + alphabetical tree of processes
  // ---------------------------------------------------------------------
  function renderSidebar(){
    var el = document.getElementById("process-tree");
    if (!el) return;
    var q = searchText.trim().toLowerCase();
    var filtered = processList.filter(function(p){
      var name = (p.name || "procesnaam").toLowerCase();
      return name.indexOf(q) !== -1;
    });
    filtered.sort(function(a, b){
      return (a.name || "").localeCompare(b.name || "", "nl", { sensitivity: "base" });
    });
    if (filtered.length === 0){
      el.innerHTML = '<p class="tree-empty">Geen processen gevonden.</p>';
      return;
    }
    var groups = {};
    var order = [];
    filtered.forEach(function(p){
      var letter = (p.name || "").trim().charAt(0).toUpperCase();
      if (!letter || !/[A-Z]/.test(letter)) letter = "#";
      if (!groups[letter]){ groups[letter] = []; order.push(letter); }
      groups[letter].push(p);
    });
    order.sort();
    var html = "";
    order.forEach(function(letter){
      html += '<div class="tree-group"><div class="tree-letter">' + letter + '</div>';
      groups[letter].forEach(function(p){
        var name = p.name ? escapeHtml(p.name) : '<span class="tree-placeholder">Procesnaam</span>';
        var activeClass = p.id === state.processId ? " active" : "";
        html +=
          '<div class="tree-item' + activeClass + '">' +
            '<button class="tree-name" data-action="selectProcess" data-process="' + p.id + '">' + name + '</button>' +
            '<button class="tree-delete" data-action="deleteProcess" data-process="' + p.id + '" title="Proces verwijderen">&times;</button>' +
          '</div>';
      });
      html += "</div>";
    });
    el.innerHTML = html;
  }

  // ---------------------------------------------------------------------
  // Supabase sync: one upsert per entity, always keyed by its own uuid.
  // Structural changes (add/remove/insert) re-sync the whole ordered list
  // of siblings so `position` always matches the array index.
  // ---------------------------------------------------------------------
  var pendingSaves = 0;
  function setSyncStatus(kind){
    var el = document.getElementById("sync-status");
    if (!el) return;
    if (kind === "saving"){ el.textContent = "Bezig met opslaan…"; el.className = "sync-status saving"; }
    else if (kind === "error"){ el.textContent = "Opslaan mislukt — controleer je verbinding"; el.className = "sync-status error"; }
    else { el.textContent = "Opgeslagen"; el.className = "sync-status idle"; }
  }

  function trackSave(queryBuilder){
    pendingSaves++;
    setSyncStatus("saving");
    return Promise.resolve(queryBuilder).then(function(res){
      pendingSaves = Math.max(0, pendingSaves - 1);
      if (res && res.error){
        console.error("Supabase sync error:", res.error);
        setSyncStatus("error");
        return;
      }
      if (pendingSaves === 0) setSyncStatus("idle");
    }, function(err){
      pendingSaves = Math.max(0, pendingSaves - 1);
      console.error("Supabase sync error:", err);
      setSyncStatus("error");
    });
  }

  function supplierValue(input){ return input.supplier === null ? null : (input.supplier.label || ""); }
  function customerValue(output){ return output.customer === null ? null : (output.customer.label || ""); }

  function syncProcessName(){
    return trackSave(sb.from("processes").upsert({
      id: state.processId, name: state.processName, updated_at: new Date().toISOString()
    }));
  }
  function syncStep(step){
    var idx = state.steps.indexOf(step);
    if (idx === -1) return Promise.resolve();
    return trackSave(sb.from("sipoc_steps").upsert({
      id: step.id, process_id: state.processId, position: idx, label: step.label
    }));
  }
  function syncStepsOrder(){
    return Promise.all(state.steps.map(function(step, i){
      return trackSave(sb.from("sipoc_steps").upsert({
        id: step.id, process_id: state.processId, position: i, label: step.label
      }));
    }));
  }
  function syncInput(step, input){
    var idx = step.inputs.indexOf(input);
    if (idx === -1) return Promise.resolve();
    return trackSave(sb.from("sipoc_inputs").upsert({
      id: input.id, step_id: step.id, position: idx, label: input.label, supplier_label: supplierValue(input)
    }));
  }
  function syncInputsOrder(step){
    return Promise.all(step.inputs.map(function(input, i){
      return trackSave(sb.from("sipoc_inputs").upsert({
        id: input.id, step_id: step.id, position: i, label: input.label, supplier_label: supplierValue(input)
      }));
    }));
  }
  function syncOutput(step, output){
    var idx = step.outputs.indexOf(output);
    if (idx === -1) return Promise.resolve();
    return trackSave(sb.from("sipoc_outputs").upsert({
      id: output.id, step_id: step.id, position: idx, label: output.label, customer_label: customerValue(output)
    }));
  }
  function syncOutputsOrder(step){
    return Promise.all(step.outputs.map(function(output, i){
      return trackSave(sb.from("sipoc_outputs").upsert({
        id: output.id, step_id: step.id, position: i, label: output.label, customer_label: customerValue(output)
      }));
    }));
  }
  function deleteStepRow(id){ return trackSave(sb.from("sipoc_steps").delete().eq("id", id)); }
  function deleteInputRow(id){ return trackSave(sb.from("sipoc_inputs").delete().eq("id", id)); }
  function deleteOutputRow(id){ return trackSave(sb.from("sipoc_outputs").delete().eq("id", id)); }

  // ---------------------------------------------------------------------
  // Loading / switching / creating / deleting processes
  // ---------------------------------------------------------------------
  function fetchProcessList(){
    return sb.from("processes").select("id,name").then(function(res){
      if (res.error){ console.error(res.error); processList = []; return; }
      processList = res.data || [];
    });
  }

  function loadProcess(id){
    setSyncStatus("saving");
    return sb.from("processes").select("*").eq("id", id).single().then(function(procRes){
      if (procRes.error || !procRes.data){ console.error(procRes.error); setSyncStatus("error"); return false; }
      var proc = procRes.data;
      return sb.from("sipoc_steps").select("*").eq("process_id", id).order("position").then(function(stepsRes){
        var stepsRows = stepsRes.data || [];
        var stepIds = stepsRows.map(function(s){ return s.id; });
        var inputsP = stepIds.length ? sb.from("sipoc_inputs").select("*").in("step_id", stepIds).order("position") : Promise.resolve({ data: [] });
        var outputsP = stepIds.length ? sb.from("sipoc_outputs").select("*").in("step_id", stepIds).order("position") : Promise.resolve({ data: [] });
        return Promise.all([inputsP, outputsP]).then(function(results){
          var inputsRows = results[0].data || [];
          var outputsRows = results[1].data || [];
          var steps = stepsRows.map(function(row){
            return {
              id: row.id,
              label: row.label,
              inputs: inputsRows.filter(function(i){ return i.step_id === row.id; }).map(function(i){
                return { id: i.id, label: i.label, supplier: i.supplier_label === null ? null : { id: makeId(), label: i.supplier_label || null } };
              }),
              outputs: outputsRows.filter(function(o){ return o.step_id === row.id; }).map(function(o){
                return { id: o.id, label: o.label, customer: o.customer_label === null ? null : { id: makeId(), label: o.customer_label || null } };
              })
            };
          });
          var seededDefault = false;
          if (steps.length === 0){ steps = [ makeStep() ]; seededDefault = true; }

          state.processId = proc.id;
          state.processName = proc.name;
          state.steps = steps;

          var url = new URL(window.location.href);
          url.searchParams.set("p", proc.id);
          window.history.replaceState(null, "", url);

          renderAll();
          setSyncStatus("idle");
          if (seededDefault) syncStepsOrder();
          return true;
        });
      });
    });
  }

  function selectProcess(id){
    if (id === state.processId) return Promise.resolve();
    return loadProcess(id);
  }

  function createNewProcess(){
    var id = makeId();
    var stepId = makeId();
    return trackSave(sb.from("processes").insert({ id: id, name: null }))
      .then(function(){ return trackSave(sb.from("sipoc_steps").insert({ id: stepId, process_id: id, position: 0, label: null })); })
      .then(fetchProcessList)
      .then(function(){ return loadProcess(id); })
      .then(function(){
        var nameBox = document.querySelector(".box-process-name");
        if (nameBox) startEdit(nameBox);
      });
  }

  function deleteProcess(id){
    if (!window.confirm("Dit proces en de bijbehorende SIPOC volledig verwijderen? Dit kan niet ongedaan worden gemaakt.")) return;
    trackSave(sb.from("processes").delete().eq("id", id)).then(function(){
      processList = processList.filter(function(p){ return p.id !== id; });
      if (state.processId === id){
        if (processList.length){
          var next = processList.slice().sort(function(a, b){
            return (a.name || "").localeCompare(b.name || "", "nl", { sensitivity: "base" });
          })[0];
          loadProcess(next.id);
        } else {
          createNewProcess();
        }
      } else {
        renderSidebar();
      }
    });
  }

  // ---------------------------------------------------------------------
  // Editable-box path resolution + edit lifecycle
  // ---------------------------------------------------------------------
  function getByPath(path){
    if (path === "process.name"){
      return { kind: "process", obj: state, key: "processName" };
    }
    var parts = path.split(".");
    var stepIdx = parseInt(parts[0], 10);
    var step = state.steps[stepIdx];
    if (parts.length === 2) return { kind: "step", obj: step, key: parts[1], step: step };
    if (parts[1] === "input"){
      var inp = step.inputs[parseInt(parts[2], 10)];
      if (parts.length === 4) return { kind: "input", obj: inp, key: parts[3], step: step, input: inp };
      if (parts[3] === "supplier") return { kind: "supplier", obj: inp.supplier, key: parts[4], step: step, input: inp };
    }
    if (parts[1] === "output"){
      var out = step.outputs[parseInt(parts[2], 10)];
      if (parts.length === 4) return { kind: "output", obj: out, key: parts[3], step: step, output: out };
      if (parts[3] === "customer") return { kind: "customer", obj: out.customer, key: parts[4], step: step, output: out };
    }
    return null;
  }

  function startEdit(el){
    el.setAttribute("contenteditable", "true");
    if (el.classList.contains("placeholder")){
      el.textContent = "";
    }
    el.focus();
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function finishEdit(el){
    var path = el.getAttribute("data-path");
    var ref = getByPath(path);
    var value = el.textContent.replace(/\s+/g, " ").trim();
    el.setAttribute("contenteditable", "false");
    if (!ref || !ref.obj){ return; }
    ref.obj[ref.key] = value.length ? value : null;

    switch (ref.kind){
      case "process":
        syncProcessName();
        var entry = processList.filter(function(p){ return p.id === state.processId; })[0];
        if (entry) entry.name = state.processName;
        renderSidebar();
        break;
      case "step":
        syncStep(ref.step);
        break;
      case "input":
      case "supplier":
        syncInput(ref.step, ref.input);
        break;
      case "output":
      case "customer":
        syncOutput(ref.step, ref.output);
        break;
    }
    render();
    if (ref.kind === "process") renderProcessHeader();
  }

  // ---------------------------------------------------------------------
  // Event delegation (click / edit) on #main — covers the process-name
  // header box as well as the whole board
  // ---------------------------------------------------------------------
  var main = document.getElementById("main");

  main.addEventListener("click", function(e){
    var boxEl = e.target.closest(".box");
    if (boxEl && boxEl.getAttribute("contenteditable") !== "true"){
      startEdit(boxEl);
      return;
    }

    var btn = e.target.closest("button[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    var stepIdx = btn.hasAttribute("data-step") ? parseInt(btn.getAttribute("data-step"), 10) : null;
    var inputIdx = btn.hasAttribute("data-input") ? parseInt(btn.getAttribute("data-input"), 10) : null;
    var outputIdx = btn.hasAttribute("data-output") ? parseInt(btn.getAttribute("data-output"), 10) : null;
    var step = stepIdx !== null ? state.steps[stepIdx] : null;

    switch (action){
      case "addStep":
        state.steps.splice(stepIdx + 1, 0, makeStep());
        render();
        syncStepsOrder();
        break;
      case "removeStep":
        if (state.steps.length > 1){
          var removedStep = state.steps.splice(stepIdx, 1)[0];
          render();
          deleteStepRow(removedStep.id).then(syncStepsOrder);
        } else {
          var oldStep = state.steps[0];
          state.steps[0] = makeStep();
          render();
          deleteStepRow(oldStep.id).then(syncStepsOrder);
        }
        break;
      case "addInput":
        step.inputs.push(makeInput());
        render();
        syncInputsOrder(step);
        break;
      case "removeInput": {
        var removedInput = step.inputs.splice(inputIdx, 1)[0];
        render();
        deleteInputRow(removedInput.id).then(function(){ syncInputsOrder(step); });
        break;
      }
      case "addSupplier":
        step.inputs[inputIdx].supplier = makeSupplier();
        render();
        syncInput(step, step.inputs[inputIdx]);
        break;
      case "removeSupplier":
        step.inputs[inputIdx].supplier = null;
        render();
        syncInput(step, step.inputs[inputIdx]);
        break;
      case "addOutput":
        step.outputs.push(makeOutput());
        render();
        syncOutputsOrder(step);
        break;
      case "removeOutput": {
        var removedOutput = step.outputs.splice(outputIdx, 1)[0];
        render();
        deleteOutputRow(removedOutput.id).then(function(){ syncOutputsOrder(step); });
        break;
      }
      case "addCustomer":
        step.outputs[outputIdx].customer = makeCustomer();
        render();
        syncOutput(step, step.outputs[outputIdx]);
        break;
      case "removeCustomer":
        step.outputs[outputIdx].customer = null;
        render();
        syncOutput(step, step.outputs[outputIdx]);
        break;
      default:
        return;
    }
  });

  main.addEventListener("focusout", function(e){
    var boxEl = e.target.closest(".box");
    if (boxEl && boxEl.getAttribute("contenteditable") === "true"){
      finishEdit(boxEl);
    }
  });

  main.addEventListener("keydown", function(e){
    var boxEl = e.target.closest(".box");
    if (!boxEl) return;
    if (e.key === "Enter"){
      e.preventDefault();
      boxEl.blur();
    } else if (e.key === "Escape"){
      e.preventDefault();
      boxEl.blur();
    }
  });

  // ---------------------------------------------------------------------
  // Sidebar events (search + tree clicks, delegated)
  // ---------------------------------------------------------------------
  document.getElementById("search").addEventListener("input", function(e){
    searchText = e.target.value;
    renderSidebar();
  });

  document.getElementById("new-process-btn").addEventListener("click", createNewProcess);

  document.getElementById("process-tree").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    var pid = btn.getAttribute("data-process");
    if (action === "selectProcess") selectProcess(pid);
    else if (action === "deleteProcess") deleteProcess(pid);
  });

  // ---------------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------------
  function init(){
    fetchProcessList().then(function(){
      renderSidebar();
      var params = new URLSearchParams(window.location.search);
      var wantedId = params.get("p");
      var target = null;
      if (wantedId && processList.some(function(p){ return p.id === wantedId; })) target = wantedId;
      else if (processList.length){
        target = processList.slice().sort(function(a, b){
          return (a.name || "").localeCompare(b.name || "", "nl", { sensitivity: "base" });
        })[0].id;
      }
      if (target) return loadProcess(target);
      return createNewProcess();
    });
  }

  init();
})();
</script>

</body>
</html>
